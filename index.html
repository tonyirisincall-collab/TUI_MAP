<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TUI Pre-Travel System Map</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cg stroke='white' stroke-width='1.8' stroke-linecap='round'%3E%3Cline x1='16' y1='16' x2='8' y2='9'/%3E%3Cline x1='16' y1='16' x2='24' y2='9'/%3E%3Cline x1='16' y1='16' x2='16' y2='25'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4.2' fill='white'/%3E%3Ccircle cx='8' cy='9' r='2.6' fill='white'/%3E%3Ccircle cx='24' cy='9' r='2.6' fill='white'/%3E%3Ccircle cx='16' cy='25' r='2.6' fill='white'/%3E%3C/svg%3E">

<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#eef2f8;--ink:#1c2a44;--muted:#66758f;--line:#dfe6f1;--brand:#2f6fed;--root:#1c2a44;--shadow:0 1px 2px rgba(28,42,68,.05),0 12px 30px -16px rgba(28,42,68,.2);--ease:cubic-bezier(.22,.8,.3,1)}
[data-theme="dark"]{--bg:#0f1624;--surface:#171f30;--surface2:#1f293d;--ink:#e7edf8;--muted:#93a1ba;--line:#2a364d;--brand:#6b97ff;--root:#e7edf8;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}
.search{position:relative;flex:1;max-width:520px;margin-left:8px}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px 9px 34px;font:500 14px Inter,system-ui,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
#res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none}
#res.open{display:block}
#res button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;cursor:pointer;align-items:flex-start}
#res button:hover,#res button.sel{background:var(--surface2)}
#res i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
#res b{display:block;font-size:13.5px}#res span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 13px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;transition:transform .25s var(--ease),background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);background:var(--surface2)}
.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 390px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%}
.nd{cursor:pointer;transition:transform .7s var(--ease),opacity .45s ease;outline:none}
.nd.off{opacity:0;pointer-events:none}
.nd rect{fill:color-mix(in srgb,var(--c) 13%,var(--surface));stroke:var(--c);stroke-width:1.6;transition:fill .2s}
.nd text{fill:var(--ink);font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.nd:hover rect,.nd:focus-visible rect{fill:color-mix(in srgb,var(--c) 28%,var(--surface))}
.nd.hub rect{stroke-width:2.8}
.nd.focus{cursor:default}
.nd.focus rect{fill:var(--c);stroke:var(--c)}
.nd.focus text{fill:#fff;font-size:15px;font-weight:700}
.nd.root rect{fill:var(--root)}.nd.root text{fill:var(--bg)}
.ed{fill:none;stroke-width:2.2;opacity:.6;animation:edge .6s ease both}
.ed2{fill:none;stroke-width:1.2;stroke-dasharray:3 5;opacity:.28;animation:edge .8s ease both}
@keyframes edge{from{opacity:0}}
.hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.trail{position:absolute;left:14px;right:14px;top:10px;display:flex;gap:5px;flex-wrap:nowrap;align-items:center;font-size:12px;color:var(--muted);overflow-x:auto;scrollbar-width:none;padding:2px 0;z-index:5}
.trail::-webkit-scrollbar{display:none}
.trail span{flex:none}
.trail button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font:600 12px Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .2s var(--ease),border-color .2s,background .2s}
.trail button:hover:not(.cur){transform:translateY(-1px);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.trail button.cur{cursor:default}
.trail button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:22px 22px 40px}
.panel .in{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:999px;padding:4px 11px}
.panel h2{margin:12px 0 4px;font-size:23px;letter-spacing:-.02em;line-height:1.2}
.sum{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.panel ul{margin:0 0 6px;padding-left:18px;font-size:14px}.panel li{margin:0 0 6px}
.panel h3{margin:20px 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;transition:transform .25s var(--ease),border-color .2s,background .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.gname{font-size:11px;color:var(--muted);margin:10px 0 5px;font-weight:600}
.panel a{color:var(--brand);word-break:break-all}
.how{display:grid;gap:8px;margin:0 0 6px;padding:0;list-style:none}
.how li{display:flex;gap:10px;align-items:flex-start;margin:0}
.how b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
@media(max-width:820px){
 main{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
 .stage{min-height:300px;flex:none}
 .trail button{max-width:110px}
 .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
 .bar{flex-wrap:wrap}.search{order:5;flex-basis:100%;max-width:none;margin:0}
 .brand small{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
.starwrap{position:relative}
#sl{position:absolute;top:calc(100% + 8px);right:0;width:280px;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:none;z-index:40}
#sl.open{display:block}
#sl button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;cursor:pointer;align-items:flex-start}
#sl button:hover{background:var(--surface2)}
#sl i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
#sl b{display:block;font-size:13.5px}#sl span{font-size:12px;color:var(--muted)}
#sl .empty{padding:14px;font-size:13px;color:var(--muted)}
#starsbtn b{color:#e0a21b}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.starbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.starbtn:hover{transform:translateY(-1px);background:var(--surface2)}
.starbtn.on{color:#b7791f;border-color:#e0a21b;background:color-mix(in srgb,#e0a21b 14%,var(--surface))}
#mynote{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:14px Inter,system-ui,sans-serif;outline:none}
#mynote:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.nsaved{height:18px;font-size:12px;font-weight:600;color:#2e9d6a;margin-top:4px}
.nd .dstar,.nd.focus .dstar{fill:#e0a21b;font-size:15px;stroke:var(--surface);stroke-width:2.5px;paint-order:stroke;pointer-events:none}
.nd .dnote{fill:#e0a21b;stroke:var(--surface);stroke-width:2;pointer-events:none}
#install[hidden]{display:none}
#res .qh{padding:8px 12px 2px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">System Map<small>TUI Pre-Travel</small></div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="q" type="text" placeholder="Search a code or topic: CANS, PRII, memo, H1079..." autocomplete="off" spellcheck="false"><div id="res"></div></div>
  <div class="starwrap"><button class="btn" id="starsbtn" type="button">★ <b id="starcount">0</b></button><div id="sl"></div></div>
  <button class="btn" id="back" type="button" disabled>&larr; Back</button>
  <button class="btn pri" id="home" type="button">Map</button>
  <button class="btn pri" id="install" type="button" hidden>Install</button>
  <button class="btn" id="theme" type="button" aria-label="Dark or light">Dark</button>
</header>
<main>
  <section class="stage" id="stage"><div class="trail" id="trail"></div><svg id="svg" role="img" aria-label="System map"><g id="edges"></g><g id="nodes"></g></svg><div class="hint">Tap a bubble to move there. Tap any step in the path above to jump back to it.<span id="offl"></span></div></section>
  <aside class="panel" id="panel"></aside>
</main>

<script>
/* ---------- groups ---------- */
const G={root:['Start','#1c2a44'],calls:['Call checks','#1a9c8b'],atcom:['Atcom','#2f6fed'],money:['Money','#b45309'],cancel:['Cancellation','#d4495a'],ovr:['Overrides and promo','#7e22ce'],memos:['Memos and CAR','#0e7490'],codes:['Codes','#4d7c0f'],flights:['Flights and seats','#4338ca'],teams:['Teams','#be185d'],quality:['Quality and app','#0f766e']};
const ORDER=['calls','atcom','money','cancel','ovr','memos','codes','flights','teams','quality'];
const H=(g,l,s,r)=>({id:'h_'+g,g,hub:1,l,s,b:[],r});
const D=[
H('calls','Call checks','What to check before, during and after every call.',['h_memos','h_money','h_quality']),
H('atcom','Atcom','Amending and cancelling bookings in Atcom.',['h_cancel','h_money','h_ovr']),
H('money','Money','Fees, deposits, Direct Debit and refunds.',['h_cancel','h_calls','h_atcom']),
H('cancel','Cancellation','TUI UK cancellation charges and how to work them out.',['h_atcom','h_money','h_ovr']),
H('ovr','Overrides and promo','Stop sale overrides, price codes and promo codes.',['h_memos','h_cancel','h_atcom']),
H('memos','Memos and CAR','How to add memos, and which code to use.',['h_calls','h_ovr','h_codes']),
H('codes','Codes','Abbreviations, welfare codes and ABTA numbers.',['h_memos','h_flights']),
H('flights','Flights and seats','Seats, infant seats and assistance.',['h_codes','h_teams']),
H('teams','Teams','Which team handles what, with numbers.',['h_flights','h_quality']),
H('quality','Quality and app','The four quality areas and the TUI app.',['h_teams','h_calls']),
/* calls */
{id:'verify',g:'calls',l:'Verification types',s:'Green, red (manual GDPR) or retail/third party.',b:['<b>Green:</b> confirm the customer\'s full name.','<b>Red (manual GDPR):</b> booking reference, departure date in full (day, month and year) and full name as it appears on the booking.','<b>Retail / third party:</b> booking reference, departure date in full and the store ABTA number.'],r:['abta','gdprrules']},
{id:'gdprrules',g:'calls',l:'GDPR rules',s:'Who you can share details with.',b:['Follow the GDPR rules for the booking type: outbound statement, customer, third party or retail.','Never share booking-specific details with unauthorised passengers.','A passenger who is not the policyholder can amend only with the policyholder\'s consent.'],r:['consent','pause','memonla']},
{id:'pause',g:'calls',l:'Pause the recording',s:'Always when you take payment details.',b:['Pause the call recording whenever you collect payment details.','Part of the Expertise quality area.'],r:['q3']},
{id:'readback',g:'calls',l:'Full read back',s:'Read the whole booking back before you finish.',b:['<b>Flights:</b> route, dates and times (outbound and inbound).','<b>Passengers:</b> names as on the passports, and dates of birth.','<b>Accommodation:</b> hotel and rooms.','<b>Extras:</b> luggage and seat numbers.','<b>Price:</b> total, deposit paid today, balance and its due date.','<b>Information:</b> resort transfer times, Travel Aware guidelines, Package Travel Regulations information.','Then add the mandatory memo and answer "Full read back given" in your notes.'],r:['aftercall','addmemo','dd','seats']},
{id:'aftercall',g:'calls',l:'After-call notes',s:'The fields to complete after every call.',b:['Who called? GDPR passed? Reason for call?','Action taken, including any c4c case references.','App? Sales? Errata? Insurance?','Full read back given (Y or N)?','Code, Amount, Reason when you used a code (CAR).','Customers get an updated email confirmation within 24 hours and a survey after the call.'],r:['car','q4','tuiapp']},
/* atcom */
{id:'amend',g:'atcom',l:'Amend: steps 1 to 3',s:'The same first steps for every change.',b:['Tick the checkbox in front of the accommodation service line.','Click "Menu".','Select the option for what you are changing.'],r:['board','room','dates','addcost']},
{id:'board',g:'atcom',l:'Board basis upgrade',s:'Change the Internal Board Code.',b:['After Menu: "Modify External Accommodation Details".','Change the <b>Internal Board Code</b> to match the upgrade.','Click "Update", then "Close".'],r:['amend','stopsale']},
{id:'room',g:'atcom',l:'Room type upgrade',s:'Change the External Room Description.',b:['After Menu: "Modify External Accommodation Details".','Change the <b>External Room Description</b> to match the upgrade.','Click "Refresh", then "Update".'],r:['amend']},
{id:'dates',g:'atcom',l:'Dates, destination, duration',s:'Use Amend Inclusive.',b:['After Menu: "Amend Inclusive".','Follow the booking flow (dates, flights, accommodation).','Insurance drops to a cancelled service line if applicable.'],r:['amend','stopsale','promoinvalid','hct']},
{id:'addcost',g:'atcom',l:'Add costs (PRII)',s:'Service > Override Cost.',b:['Tick the accommodation line, then Service > "Override Cost".','Enter code <b>PRII</b>, quantity 1, the cost and the currency.','Tick all passengers and click "Update".','Multicentre bookings: first accommodation line only.'],r:['amend','prii','car']},
{id:'cancelsteps',g:'atcom',l:'Cancel a booking: steps',s:'Cancel, show the fees, then add the fee.',b:['Tick the accommodation line checkbox, then "Menu" and "Cancel".','Display the cancellation fees to the customer.','Select a reason, then "Other" and give a detailed reason.','Click "Continue".'],r:['cans','aftercancel','bands']},
{id:'cans',g:'atcom',l:'CANS: add the fee',s:'Manual Prices with code CANS.',b:['Tick the cancellation fee service line.','Service > "Manual Prices".','Use code <b>CANS</b> and apply the fee amount.','Select "Update and Close to Continue".'],r:['cancelsteps','method','tuiled']},
{id:'aftercancel',g:'atcom',l:'After cancelling',s:'Three things not to forget.',b:['Old amendment fees <b>remain</b> on the original booking.','Check the unpaid balance and transfer funds if necessary.','Add booking memos using the CAR template.'],r:['car','dd']},
{id:'consent',g:'atcom',l:'Policyholder consent',s:'Non-policyholders need permission.',b:['Passengers who are not the policyholder can amend with the policyholder\'s consent.','Confirm the policyholder has given permission before you proceed.'],r:['gdprrules']},
/* money */
{id:'adminrule',g:'money',l:'Admin fee rule',s:'Paid more or less than deposit + admin fees?',b:['Compare what the customer has paid with (deposit + admin fees).','<b>Paid MORE:</b> do not collect the fees now.','<b>Paid LESS:</b> you MUST collect the fees immediately.','Example: deposit £400, paid £1,000, fees £100. Total needed £500. £1,000 is more than £500, so do not collect the £100.','Admin fees are non-refundable, even if the customer cancels later.'],r:['deposit','dd','car']},
{id:'deposit',g:'money',l:'Deposits and low deposit',s:'Deposit at booking. Low deposit can still be amended.',b:['The deposit must be taken at the time of booking. Check TUI Know-How for the amounts.','Outstanding low deposit: you CAN amend before the full deposit balance is paid, and you do not need to collect it first. Only collect the new admin fee.'],r:['adminrule','cxrules']},
{id:'dd',g:'money',l:'Direct Debit and refunds',s:'Atcom adjusts DDs. Wait 5 days before refunds.',b:['After an amendment, Atcom adjusts the Direct Debit payments automatically.','Wait at least <b>5 days</b> after the most recent Direct Debit before processing a refund.','HCMH holds a price difference for 10 days.','Standard wording after a TUI-led cancellation: refund within 7 to 10 working days.'],r:['hcmh','aftercancel','readback','memobe']},
/* cancel */
{id:'bands',g:'cancel',l:'Charge bands',s:'Percentage of the total price, by days before departure.',b:['<b>70 days or more:</b> loss of deposit','<b>69 to 63 days:</b> 30%','<b>62 to 49 days:</b> 50%','<b>48 to 29 days:</b> 70%','<b>28 to 15 days:</b> 90%','<b>14 to 0 days:</b> 100%','Package holidays with a TUI flight. From the TUI UK help page, checked October 2026.'],r:['method','cxrules','examples','cancelsteps']},
{id:'method',g:'cancel',l:'Method',s:'Days, charge, refund.',b:['<b>Days</b> = departure date minus cancellation date.','<b>Charge</b> = band % x total price. The deposit is non-refundable, so keep the higher of the two. Add non-refundable extras.','<b>Refund</b> = paid minus the charge. If the charge is higher than paid, the customer owes the difference.'],r:['bands','examples','cans']},
{id:'examples',g:'cancel',l:'Worked examples',s:'36 days and 23 days before.',b:['Departure 10 Sep 2026, cancelled 5 Aug 2026 (36 days): £4,500 x 70% = £3,150 fee. Refund £1,350.','Departure 20 Jun 2026, cancelled 28 May 2026 (23 days): £2,800 x 90% = £2,520 fee. Refund £280.','Refund assumes the customer paid in full.'],r:['bands','method']},
{id:'cxrules',g:'cancel',l:'Rules to remember',s:'Low deposit, other bookings, passengers.',b:['<b>Low Deposit Offer:</b> the full deposit on the confirmation invoice is payable.','<b>Flight-only, hotel-only, coach tours and scheduled airfares</b> have different charges. Check the booking conditions.','<b>Removing a passenger</b> can raise the overall cost.','Offer alternatives first where possible: move the dates or amend (explain any fees).','A cancellation invoice follows within 14 days of cancelling.'],r:['deposit','bands','q2']},
{id:'tuiled',g:'cancel',l:'If TUI cancels or changes',s:'No fee. Remove the cancellation fees.',b:['No cancellation fee if TUI cancels or makes a significant change.','To remove fees after a TUI-led change: Service > Manual Prices, split across all passengers.','Example wording: full refund within 7 to 10 working days.'],r:['cans','dd']},
/* ovr */
{id:'stopsale',g:'ovr',l:'Stop sale overrides',s:'Which ones need Commercial approval.',b:['<b>No approval:</b> board change, removing passengers (same room type), adding a passenger within the room occupancy.','<b>Commercial approval first:</b> adding a room, changing travel dates.','Contact Commercial first, then override after approval.'],r:['board','dates','prii']},
{id:'prii',g:'ovr',l:'PRII / PRID',s:'Adjust pricing or add costs.',b:['PRII: add the amount to the accommodation line and split across passengers.','PRII or PRID: first accommodation line only on multicentre bookings.','Also used to match a quoted child fare for an infant seat.'],r:['addcost','infant','car','bpd']},
{id:'bpd',g:'ovr',l:'BPD: price difference',s:'Split evenly across passengers.',b:['Use after an amendment changes the price.','Example: a £235 difference over 3 passengers = £78.33 on two and £78.34 on the lead.'],r:['car','prii']},
{id:'oldr',g:'ovr',l:'OLDR: digital voucher',s:'Reapply a compensation voucher.',b:['Enter the original booking reference in the reason text.','Apply the voucher amount as a discount.'],r:['car']},
{id:'hcmh',g:'ovr',l:'HCMH: hold the difference',s:'Booking is cheaper after an amendment.',b:['Apply HCMH and hold the difference for <b>10 days</b> while the customer decides on further changes.','After that it is refunded automatically to the original payment method.','Also applied with TRD so a promo reapply is not auto-refunded.'],r:['dd','trd']},

const cv=document.createElement('canvas').getContext('2d');
const tw=(t,fs,w)=>{cv.font=w+' '+fs+'px Inter, system-ui, sans-serif';return cv.measureText(t).width};
function wrap(label,max){const w=label.split(' ');const L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>max&&c){L.push(c);c=x}else c=(c+' '+x).trim()});L.push(c);return L}
function size(n,focus,narrow){const fs=focus?15:12.5,wt=focus?700:600,max=focus?(narrow?16:20):(narrow?14:17);const L=wrap(n.l,max);const w=Math.max(...L.map(l=>tw(l,fs,wt)))+(focus?36:26);const h=L.length*fs*1.28+(focus?20:15);return{L,fs,w:Math.ceil(w),h:Math.ceil(h)}}
function ordered(f){const fg=N[f].g;const ids=[...adj[f]].filter(i=>f==='__root'||i!=='__root');const gi=g=>g===fg?-1:(ORDER.indexOf(g));return ids.sort((a,b)=>{const A=N[a],B=N[b];return (gi(A.g)-gi(B.g))||((B.hub?1:0)-(A.hub?1:0))||(idx[a]-idx[b])})}
function layout(f,W,H,narrow){
  const nb=ordered(f);const fs=size(N[f],true,narrow);const items=nb.map(id=>({id,...size(N[id],false,narrow)}));
  if(narrow){const n=items.length,rows=Math.ceil(n/2),mh=Math.max(...items.map(i=>i.h)),rowH=mh+10;
    const fy=(trail.offsetHeight||28)+22+fs.h/2,y0=fy+fs.h/2+34;
    items.forEach((it,i)=>{const col=i<rows?0:1,row=i<rows?i:i-rows;it.x=W*(col?0.735:0.265);it.y=y0+row*rowH+mh/2});
    if(n%2===1&&rows>1){/* keep the last pill in its own column */}
    const all=[{id:f,x:W/2,y:fy,fixed:1,...fs},...items];all.height=Math.ceil(y0+rows*rowH+14);return all}
  const cx=W/2,cy=H/2+(narrow?14:18),n=items.length,mw=Math.max(...items.map(i=>i.w)),mh=Math.max(...items.map(i=>i.h));
  const rxM=Math.max(60,W/2-mw/2-10),ryM=Math.max(60,(H-34)/2-mh/2-10);
  items.forEach((it,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;let k=n<=7?0.92:(n<=10?(i%2?0.7:1):(i%2?0.58:1));it.x=cx+Math.cos(a)*rxM*k;it.y=cy+Math.sin(a)*ryM*k});
  const all=[{id:f,x:cx,y:cy,w:fs.w,h:fs.h,fixed:1,...fs},...items];
  for(let it=0;it<80;it++){let moved=false;
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],b=all[j];const ox=(a.w+b.w)/2+8-Math.abs(a.x-b.x),oy=(a.h+b.h)/2+6-Math.abs(a.y-b.y);
      if(ox>0&&oy>0){moved=true;const vert=oy<ox;const dir=vert?(a.y<=b.y?-1:1):(a.x<=b.x?-1:1);const d=(vert?oy:ox)/2+0.5;
        const wa=a.fixed?0:(b.fixed?1:.5),wb=b.fixed?0:(a.fixed?1:.5);
        if(vert){a.y+=dir*d*2*wa;b.y-=dir*d*2*wb}else{a.x+=dir*d*2*wa;b.x-=dir*d*2*wb}}}
    all.forEach(o=>{if(o.fixed)return;o.x=Math.min(W-o.w/2-6,Math.max(o.w/2+6,o.x));o.y=Math.min(H-o.h/2-6,Math.max(o.h/2+34,o.y))});

function paint(g,n,role,sz){g.innerHTML='';

function render(){

function search(){const v=q.value.trim().toLowerCase();if(!v){showQuick();return}
  hits=index.map(o=>{let s=99;if(o.l.startsWith(v))s=0;else if(o.l.includes(v))s=1;else if((o.t+' '+(notes[o.n.id]||'').toLowerCase()).includes(v))s=3;return{o,s}}).filter(x=>x.s<99).sort((a,b)=>a.s-b.s).slice(0,8);sel=0;
  res.innerHTML=hits.length?hits.map((h,i)=>'<button type="button" data-i="'+i+'" class="'+(i===0?'sel':'')+'"><i style="background:'+color(h.o.n)+'"></i><div><b>'+h.o.n.l+'</b><span>'+G[h.o.n.g][0]+': '+h.o.n.s+'</span></div></button>').join(''):'<button type="button" disabled><div><b>No match</b><span>Try a code (CANS, PRII, BPD) or a word (deposit, memo).</span></div></button>';
  res.classList.add('open')}
function pick(i){const h=hits[i];if(!h)return;res.classList.remove('open');q.value='';q.blur();go(h.o.n.id)}
function showQuick(){hits=[];let h='';const add=(t,ids)=>{ids=ids.filter(i=>N[i]);if(!ids.length)return;h+='<div class="qh">'+t+'</div>';ids.forEach(id=>{h+='<button type="button" data-i="'+hits.length+'"><i style="background:'+color(N[id])+'"></i><div><b>'+N[id].l+'</b><span>'+G[N[id].g][0]+'</span></div></button>';hits.push({o:{n:N[id]}})})};add('Starred',stars);add('Recent',recent.filter(i=>!stars.includes(i)).slice(0,5));sel=0;if(h){res.innerHTML=h;res.classList.add('open');const b=res.querySelector('button');if(b)b.classList.add('sel')}else res.classList.remove('open')}
q.addEventListener('input',search);q.addEventListener('focus',()=>{if(!q.value.trim())showQuick()});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+hits.length)%Math.max(hits.length,1);[...res.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('sel',i===sel))}else if(e.key==='Enter'){e.preventDefault();pick(sel)}else if(e.key==='Escape'){q.value='';res.classList.remove('open');q.blur()}});
res.addEventListener('mousedown',e=>{const b=e.target.closest('[data-i]');if(b){e.preventDefault();pick(+b.dataset.i)}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.classList.remove('open')});

/* ---------- theme ---------- */
const th=document.getElementById('theme');
function setTheme(m){document.documentElement.dataset.theme=m;th.textContent=m==='dark'?'Light':'Dark';try{localStorage.setItem('tui-map-theme',m)}catch(e){}document.querySelector('meta[name=theme-color]').content=m==='dark'?'#0f1624':'#f4f7fb'}
th.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');

/* ---------- stars, notes, recent ---------- */
const personal=()=>{let h='';const sec=(t,ids)=>{if(ids.length)h+='<h3>'+t+'</h3><div class="chips">'+ids.map(chip).join('')+'</div>'};
  sec('Starred',stars);sec('Recent',recent.slice(0,6));sec('My notes',Object.keys(notes));return h};
const starBtn=id=>'<button type="button" class="starbtn'+(stars.includes(id)?' on':'')+'" id="starbtn" data-star="'+id+'" aria-pressed="'+stars.includes(id)+'">'+(stars.includes(id)?'\u2605 Starred':'\u2606 Star')+'</button>';
const noteBlock=id=>'<h3>My note</h3><textarea id="mynote" data-id="'+id+'" placeholder="Write something you want to remember about this...">'+esc(notes[id]||'')+'</textarea><div class="nsaved" id="nsaved"></div>';
const slWrap=document.getElementById('sl'),starsBtn=document.getElementById('starsbtn');
function renderStars(){document.getElementById('starcount').textContent=stars.length;
  slWrap.innerHTML=stars.length?stars.map(id=>'<button type="button" data-go="'+id+'"><i style="background:'+color(N[id])+'"></i><div><b>'+N[id].l+'</b><span>'+G[N[id].g][0]+'</span></div></button>').join(''):'<div class="empty">Open any bubble and tap Star. It will appear here.</div>'}
function toggleStar(id){const i=stars.indexOf(id);if(i>=0)stars.splice(i,1);else stars.unshift(id);LS.set('tui-map-stars',stars);renderStars();redecorate(id);const b=document.getElementById('starbtn');if(b&&b.dataset.star===id){b.className='starbtn'+(stars.includes(id)?' on':'');b.textContent=stars.includes(id)?'\u2605 Starred':'\u2606 Star';b.setAttribute('aria-pressed',stars.includes(id))}}
starsBtn.onclick=e=>{e.stopPropagation();slWrap.classList.toggle('open')};
slWrap.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){slWrap.classList.remove('open');go(b.dataset.go)}});
document.addEventListener('click',e=>{if(!e.target.closest('.starwrap'))slWrap.classList.remove('open')});
let nt;panel.addEventListener('input',e=>{const t=e.target;if(t.id!=='mynote')return;const id=t.dataset.id;clearTimeout(nt);nt=setTimeout(()=>{const v=t.value.trim();if(v)notes[id]=v;else delete notes[id];LS.set('tui-map-notes',notes);redecorate(id);const s=document.getElementById('nsaved');if(s){s.textContent='Saved';clearTimeout(s._t);s._t=setTimeout(()=>{s.textContent=''},2000)}},400)});
panel.addEventListener('click',e=>{const b=e.target.closest('[data-star]');if(b)toggleStar(b.dataset.star)});
renderStars();
/* ---------- install and offline ---------- */
let dip=null;const inst=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;inst.hidden=false});
inst.onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;inst.hidden=true};
window.addEventListener('appinstalled',()=>{inst.hidden=true});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{document.getElementById('offl').textContent=' Works offline.'}).catch(()=>{})}

/* ---------- start (supports #id links) ---------- */
const h0=(location.hash||'').slice(1);if(N[h0]&&h0!=='__root')hist=['__root',h0];
D.forEach(n=>els[n.id].style.transition='none');render();requestAnimationFrame(()=>requestAnimationFrame(()=>D.forEach(n=>els[n.id].style.transition='')));
</script>
</body>
